name: Refresh examples

# Runs this action against its own repository, so the examples in the README
# are real output and the action is tested every week.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/**, action.yml]

permissions:
  contents: write

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pixel Profile demo
        uses: ./
        with:
          token: ${{ github.token }}
          name: Pixel Profile
          title: Your name, in contribution squares
          tagline: Profile README cards drawn from your GitHub data.
          footer: hero  ·  stats  ·  stack  ·  no third-party servers
          stack: nextdotjs:Next.js,typescript:TypeScript,postgresql:Postgres,python:Python,docker:Docker,vercel:Vercel
          output_dir: examples

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples
          git diff --cached --quiet || (git commit -m "Refresh examples" && git push)
